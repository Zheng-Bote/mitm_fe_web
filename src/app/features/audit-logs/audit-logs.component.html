<div class="p-6 flex flex-col gap-6">
  <div class="flex flex-wrap items-center gap-4">
    <button hlmBtn variant="outline" (click)="onRefresh()" [disabled]="isLoading()">
      Refresh Job Audits
    </button>
    
    <div class="flex items-center gap-2 text-sm">
      <hlm-checkbox inputId="audit-logs-auto-refresh" [checked]="autoRefresh()" (checkedChange)="autoRefresh.set($event)" [disabled]="!hasLoaded()" />
      <label hlmLabel for="audit-logs-auto-refresh">Auto-Refresh (5s)</label>
    </div>

    <div class="flex items-center gap-2 border-l pl-4 ml-2">
      <hlm-checkbox inputId="audit-logs-date-filter" [checked]="useDateRange()" (checkedChange)="useDateRange.set($event); useDateRange() ? fetchData() : null" />
      <label hlmLabel for="audit-logs-date-filter">Filter by Date</label>
      
      <input hlmInput type="date" class="w-auto" aria-label="Start date"
             [ngModel]="startDateStr()"
             (ngModelChange)="startDateStr.set($event); useDateRange() ? fetchData() : null"
             [disabled]="!useDateRange()" />
      
      <span class="text-sm">to</span>
      
      <input hlmInput type="date" class="w-auto" aria-label="End date"
             [ngModel]="endDateStr()"
             (ngModelChange)="endDateStr.set($event); useDateRange() ? fetchData() : null"
             [disabled]="!useDateRange()" />
    </div>

    <div class="flex-grow"></div>
    
    <button hlmBtn variant="secondary" (click)="exportCsv()" [disabled]="logs().length === 0">
      Export CSV
    </button>
    
    <app-export-report-dialog (exportTriggered)="handleExportReport($event)"></app-export-report-dialog>
  </div>

  <div class="rounded-md border bg-card text-card-foreground shadow-sm">
    <app-audit-logs-table [logs]="logs()" [hasLoaded]="hasLoaded()"></app-audit-logs-table>
  </div>
</div>
