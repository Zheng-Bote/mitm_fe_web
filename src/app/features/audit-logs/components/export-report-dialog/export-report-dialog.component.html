<hlm-dialog>
  <button id="export-report-btn" hlmBtn hlmDialogTrigger>Export Report</button>
  <hlm-dialog-content class="sm:max-w-[425px]" *brnDialogContent="let ctx">
    <hlm-dialog-header>
      <h3 hlmDialogTitle>Export Audit Report</h3>
      <p hlmDialogDescription>Select parameters for the Excel report generation.</p>
    </hlm-dialog-header>
    
    <div class="grid gap-4 py-4">
      <div class="grid grid-cols-4 items-center gap-4">
        <label hlmLabel for="jobName" class="justify-end">Job Name</label>
        <input hlmInput id="jobName" [(ngModel)]="jobName" class="col-span-3" placeholder="Optional..." />
      </div>
      <div class="grid grid-cols-4 items-center gap-4">
        <label hlmLabel for="topic" class="justify-end">Topic</label>
        <input hlmInput id="topic" [(ngModel)]="topic" class="col-span-3" placeholder="Optional..." />
      </div>
      <div class="grid grid-cols-4 items-center gap-4">
        <label hlmLabel for="startDate" class="justify-end">Start Date</label>
        <input hlmInput id="startDate" type="date" [(ngModel)]="startDateStr" class="col-span-3" />
      </div>
      <div class="grid grid-cols-4 items-center gap-4">
        <label hlmLabel for="endDate" class="justify-end">End Date</label>
        <input hlmInput id="endDate" type="date" [(ngModel)]="endDateStr" class="col-span-3" />
      </div>
    </div>

    <hlm-dialog-footer>
      <button hlmBtn (click)="onExport(); closeBtn.click()">Generate Report</button>
      <button #closeBtn hlmDialogClose class="hidden"></button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
