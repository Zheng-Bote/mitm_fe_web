<form [formGroup]="form" (ngSubmit)="onSave()" class="space-y-4">

  <hlm-field>
    <label hlmFieldLabel for="name">Job Name</label>
    <input hlmInput id="name" type="text" formControlName="name" placeholder="e.g. backup-job" />
  </hlm-field>

  <hlm-field>
    <label hlmFieldLabel for="command">Command</label>
    <input hlmInput id="command" type="text" formControlName="command" placeholder="mitm-collector-pg" />
  </hlm-field>

  <div class="flex flex-col gap-1.5">
    <span class="text-sm font-medium leading-none" id="cron_expr_label">Schedule</span>
    <app-cron-editor formControlName="cron_expr" aria-labelledby="cron_expr_label" />
  </div>

  <hlm-field orientation="horizontal" class="pt-2">
    <hlm-checkbox inputId="enabled" formControlName="enabled" />
    <label hlmFieldLabel for="enabled">Job Enabled</label>
  </hlm-field>

  <div class="flex justify-end gap-3 pt-4 border-t mt-6">
    <button type="button" hlmBtn variant="outline" (click)="onCancel()">Cancel</button>
    <button type="submit" hlmBtn [disabled]="form.invalid">Save Job</button>
  </div>
</form>
